name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    env:
      QT_ROOT: C:/Qt/6.8.3/mingw_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Qt e toolchain
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:/Qt
          key: qt-6.8.3-mingw1310-cmake-ninja-v1

      - name: Instalar Qt 6.8.3 + MinGW 13.1 + CMake + Ninja
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw -O C:/Qt --archives qtbase qttools
          python -m aqt install-tool windows desktop tools_mingw1310 -O C:/Qt
          python -m aqt install-tool windows desktop tools_cmake -O C:/Qt
          python -m aqt install-tool windows desktop tools_ninja -O C:/Qt

      # Mesma preparacao descrita no README: as ferramentas no PATH e o Qt em
      # QT_ROOT. O CI usa exatamente o caminho que qualquer pessoa segue, entao
      # uma instrucao quebrada quebra o CI junto.
      - name: Preparar ambiente
        shell: pwsh
        run: |
          "C:/Qt/Tools/CMake_64/bin" >> $env:GITHUB_PATH
          "C:/Qt/Tools/Ninja" >> $env:GITHUB_PATH
          "C:/Qt/6.8.3/mingw_64/bin" >> $env:GITHUB_PATH
          "C:/Qt/Tools/mingw1310_64/bin" >> $env:GITHUB_PATH

      - name: Configurar
        run: cmake --preset release

      - name: Compilar
        run: cmake --build --preset release

      - name: Testar
        run: ctest --preset release
